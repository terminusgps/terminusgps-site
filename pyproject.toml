[project]
name = "terminusgps-site"
description = "Terminus GPS Website"
readme = "README.md"
version = "3.0.0"
requires-python = ">=3.14"

authors = [
    { name = "Blake Nall", email = "blake@terminusgps.com" },
]
dependencies = [
    "django==6.1.1",
    "pillow==12.3.0",
    "python-wialon>=1.2.4",
    "wagtail>=8.0",
]

[tool.pytest.ini_options]
markers = [
"e2e: end-to-end browser tests via Playwright"
]

[tool.pyright]
strictListInference = false
strictDictionaryInference = false
strictSetInference = false
typeCheckingMode = "basic"

[tool.ruff]
exclude = [
    ".git",
    ".gitignore",
    ".venv",
    "venv",
    ".vscode",
    "__pycache__",
    "node_modules",
    "site-packages",
    "dist",
    "build",
]
line-length = 79
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "DJ",
]
ignore = ["DJ001", "F821"]
fixable = [ "ALL" ]
unfixable = []
extend-per-file-ignores = {"*/migrations/*.py" = ["E501"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
skip-magic-trailing-comma = true

[dependency-groups]
deploy = [
    "django-storages[boto3,s3]>=1.14.6",
    "gunicorn>=26.2.0",
    "psycopg>=3.3.5",
    "psycopg2-binary>=2.9.13",
    "certifi>=2026.7.22",
    "django-redis>=7.0.0",
    "cryptography>=50.0.1",
]
dev = [
    "django-types>=0.24.0",
    "ipython>=9.14.1",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
]
