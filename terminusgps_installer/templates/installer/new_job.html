{% extends "terminusgps/layout.html" %}
{% load static %}
{% block title %}New Install Job{% endblock title %}
{% partialdef main %}
<script type="module" src="{% static 'formset/js/django-formset.js' %}" defer></script>
<article class="@container p-8 flex flex-col gap-8">
    <section class="flex flex-col gap-2">
        <p class="text-3xl text-gray-800 dark:text-gray-100">New Install Job</p>
        <p class="text-lg text-gray-700 dark:text-gray-200">Fill out the form then click submit.</p>
    </section>
    <django-formset endpoint="{{ request.path }}" csrf-token="{{ csrf_token }}">
        <div class="@container flex flex-col gap-8">{{ form_collection }}</div>
        <div class="mt-4">
            <button type="button" df-click="disable -> submit -> proceed !~ scrollToError" class="cursor-pointer p-2 rounded border text-gray-100 border-terminus-red-700 bg-terminus-red-600 hover:bg-terminus-red-100 transition-colors duration-300 ease-in-out">
                <div class="flex items-center gap-2">
                    <p>Submit</p>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                    </svg>
                </div>
            </button>
            <button type="button" df-click="disable -> reset" class="cursor-pointer p-2 rounded border text-gray-700 bg-gray-300 hover:bg-gray-50 transition-colors duration-300 ease-in-out">
                <div class="flex items-center gap-2">
                    <p>Reset</p>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                </div>
            </button>
        </div>
    </django-formset>
</article>
{% endpartialdef main %}
{% block content %}
{% partial main %}
{% endblock content %}
